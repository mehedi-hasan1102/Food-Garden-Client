# This file was adapted from the Firebase CLI output for the monorepo.
# Publishes a Firebase Hosting preview channel on pull request to the web app.
name: Deploy to Firebase Hosting on PR
on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/firebase-hosting-pull-request.yml"
      - "turbo.json"
      - "package.json"
      - "bun.lock"
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: oven/shiki-action@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FOOD_GARDEN_BD }}
          projectId: food-garden-bd
