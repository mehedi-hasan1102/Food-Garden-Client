# This file was adapted from the Firebase CLI output for the monorepo.
# Deploys the web app (apps/web) to Firebase Hosting on merge to main.
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - ".github/workflows/firebase-hosting-merge.yml"
      - "turbo.json"
      - "package.json"
      - "bun.lock"
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: oven/shiki-action@v1
        with:
          bun-version: latest

      # Install dependencies (workspace-aware)
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build the project
      - name: Build
        run: bun run build

      # Deploy to Firebase Hosting
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FOOD_GARDEN_BD }}
          channelId: live
          projectId: food-garden-bd
